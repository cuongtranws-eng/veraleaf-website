# VeraLeaf — app + PostgreSQL on one server.
#   1. Create .env (see .env.example): PAYLOAD_SECRET, NEXT_PUBLIC_SERVER_URL, DB_PASSWORD (+ SMTP_* optional)
#   2. docker compose up -d --build
# The app listens on 127.0.0.1:3000 only; put Nginx (deploy/nginx.conf) in front for HTTPS.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: veraleaf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: veraleaf
      # UTF-8 is required for Vietnamese text
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veraleaf -d veraleaf']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://veraleaf:${DB_PASSWORD}@db:5432/veraleaf
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
