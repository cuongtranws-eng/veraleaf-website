# Nginx reverse proxy for VeraLeaf (Ubuntu: /etc/nginx/sites-available/veraleaf)
# Then:  ln -s /etc/nginx/sites-available/veraleaf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#        certbot --nginx -d veraleaf.com.vn -d www.veraleaf.com.vn     (free HTTPS, auto-renews)

server {
    listen 80;
    listen [::]:80;
    server_name veraleaf.com.vn www.veraleaf.com.vn;

    # Uploads in the CMS are limited to 15 MB
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Long cache for Next.js build assets (file names contain a hash)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors cannot spoof their IP for the rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
